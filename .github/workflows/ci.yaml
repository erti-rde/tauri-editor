name: CI

on:
  pull_request:
  push:
    branches: [main]

# Dependency install and cargo build both run third-party scripts. Give the token
# no more than read access, and keep it out of the checkout's git config.
permissions:
  contents: read

# A newer push to the same PR makes in-flight runs redundant.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Lint, typecheck, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      # No version pin here: the `packageManager` field in package.json is the
      # single source of truth, and pnpm/action-setup reads it.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Prettier + ESLint
        run: pnpm lint

      - name: Typecheck
        run: pnpm check

      - name: Unit tests
        run: pnpm test

  rust:
    name: Clippy, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libglib2.0-dev \
            libgtk-3-dev \
            libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev

      # The toolchain and its components come from src-tauri/rust-toolchain.toml,
      # so CI and contributors run the same rustc and the same clippy lint set.
      # Installing `stable` here instead would let a new release break CI without
      # any change to this repo, since -D warnings promotes new lints to errors.
      - name: Install the pinned Rust toolchain
        working-directory: ./src-tauri
        run: rustup show active-toolchain || rustup toolchain install

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ./src-tauri -> target

      - name: Rustfmt
        working-directory: ./src-tauri
        run: cargo fmt --check

      - name: Clippy
        working-directory: ./src-tauri
        run: cargo clippy --all-targets -- -D warnings

      - name: Cargo test
        working-directory: ./src-tauri
        run: cargo test
