name: CI

on:
  pull_request:
  push:
    branches: [main]

# Dependency install and cargo build both run third-party scripts. Give the token
# no more than read access, and keep it out of the checkout's git config.
permissions:
  contents: read

# A newer push to the same PR makes in-flight runs redundant.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Lint, typecheck, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # No version pin here: the `packageManager` field in package.json is the
      # single source of truth, and pnpm/action-setup reads it.
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Prettier + ESLint
        run: pnpm lint

      - name: Typecheck
        run: pnpm check

      - name: Unit tests
        run: pnpm test

  e2e:
    name: Browser journeys
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # The version comes from the lockfile, so the browser always matches the
      # Playwright that drives it.
      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      # The harness route is dead code outside `--mode harness`; this proves the
      # build Erti ships agrees (M1a-1 AC-1).
      - name: The harness stays out of the production build
        run: pnpm build && node scripts/check-harness-excluded.mjs

      # The real app on the fake backend (M1a-1). A console error or a command
      # the fake doesn't know fails a journey. The screenshots are taken in the
      # same run and kept, so every PR has pictures of the main screens.
      - name: Journeys
        env:
          ERTI_SHOTS: '1'
        run: pnpm e2e

      - name: Keep the screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-screenshots
          path: e2e/shots
          if-no-files-found: ignore
          retention-days: 14

      - name: Keep what failed
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-results
          path: |
            e2e/.results
            e2e/.report
          retention-days: 7

  app-e2e:
    name: Real app journeys (Linux)
    # 22.04 because it ships webkit2gtk-driver; the journeys need WebKitGTK's
    # own WebDriver, which tauri-driver launches the app under.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install Tauri system dependencies, the WebKit driver and a display
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libglib2.0-dev \
            libgtk-3-dev \
            libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev \
            webkit2gtk-driver \
            xvfb

      - name: Install the pinned Rust toolchain
        working-directory: ./src-tauri
        run: rustup show active-toolchain || rustup toolchain install

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ./src-tauri -> target
          # tauri-driver is cached with the build, rather than compiled each run.
          cache-bin: true

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Install tauri-driver
        run: command -v tauri-driver || cargo install tauri-driver --locked

      - name: Build the app
        run: pnpm tauri build --debug --no-bundle

      # Journeys 1, 2 and 5 (M1a-2) through the real Rust backend, webview and
      # CSP. Journey 1 resolves metadata from doi.org, so it needs the network.
      - name: Journeys
        run: xvfb-run --auto-servernum pnpm e2e:app

      - name: Keep the screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: app-e2e-results
          path: e2e-app/results
          if-no-files-found: ignore
          retention-days: 7

  corpus:
    name: Ingest quality on real papers
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # The papers are ~29 MB of third-party work, pinned by arXiv version and
      # verified against a SHA-256 manifest rather than vendored. The cache key
      # is the manifest, so arXiv is asked only when the corpus itself changes.
      - name: Cache the benchmark corpus
        id: corpus
        uses: actions/cache@v6
        with:
          path: tests/fixtures/retrieval/papers
          key: retrieval-corpus-${{ hashFiles('tests/fixtures/retrieval/corpus.json') }}

      - name: Fetch the benchmark corpus
        if: steps.corpus.outputs.cache-hit != 'true'
        run: ./scripts/fetch-retrieval-corpus.sh

      # Without this the tests skip when the corpus is missing, and a skip reads
      # as a pass. The whole point of these assertions is that the ingest claims
      # are measured rather than asserted, so absence has to be a failure.
      # Scoped to the corpus-dependent file: the rest of the suite is hermetic
      # and already ran in the job above.
      - name: Metadata health on real papers
        env:
          ERTI_REQUIRE_CORPUS: '1'
        run: pnpm exec vitest run src/lib/ingest/metadata-health

  rust:
    name: Clippy, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libglib2.0-dev \
            libgtk-3-dev \
            libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev

      # The toolchain and its components come from src-tauri/rust-toolchain.toml,
      # so CI and contributors run the same rustc and the same clippy lint set.
      # Installing `stable` here instead would let a new release break CI without
      # any change to this repo, since -D warnings promotes new lints to errors.
      - name: Install the pinned Rust toolchain
        working-directory: ./src-tauri
        run: rustup show active-toolchain || rustup toolchain install

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ./src-tauri -> target

      - name: Rustfmt
        working-directory: ./src-tauri
        run: cargo fmt --check

      - name: Clippy
        working-directory: ./src-tauri
        run: cargo clippy --all-targets -- -D warnings

      - name: Cargo test
        working-directory: ./src-tauri
        run: cargo test
