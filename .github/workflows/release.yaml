name: Release

# From a version tag to a DRAFT release (docs/release.md, M7a-1). Nothing here
# publishes: a person installs the draft on every platform, runs the release
# checklist and presses publish, which is what makes latest.json live.
#
# Run it by hand (Actions → Release → Run workflow) for a dry run: every build
# and check, with the artefacts kept on the run and no release made.
#
# Every action is pinned by commit SHA: the build job holds signing keys and
# the draft job a write token. Dependabot keeps the pins current.

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: 1. Versions, tag and changelog agree
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # History and main, to tell whether the tag is on main.
          fetch-depth: 0

      - name: Check
        run: node scripts/release/verify.mjs

      - id: version
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

  ci:
    name: 2. Everything CI checks
    needs: verify
    uses: ./.github/workflows/ci.yaml

  build:
    name: 3. Build ${{ matrix.target }}
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            target: aarch64-apple-darwin
            bundles: app,dmg
          # GitHub keeps retiring Intel images: check this label each release.
          - os: macos-15-intel
            target: x86_64-apple-darwin
            bundles: app,dmg
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            bundles: nsis,msi
          # The oldest supported runner: an AppImage runs where glibc is at
          # least as new as the build machine's.
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            bundles: appimage,deb
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Tauri system dependencies and a display
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev \
            patchelf libglib2.0-dev libgtk-3-dev libsoup-3.0-dev libjavascriptcoregtk-4.1-dev xvfb

      # The toolchain comes from rust-toolchain.toml, as in CI; never floating stable.
      - name: Install the pinned Rust toolchain and the target
        working-directory: ./src-tauri
        run: |
          rustup show active-toolchain || rustup toolchain install
          rustup target add ${{ matrix.target }}

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: ./src-tauri -> target
          key: ${{ matrix.target }}

      # The pnpm version is `packageManager` in package.json; Node's is .nvmrc.
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Release bundles only: no debug builds beside them.
      - name: Build
        env:
          # Updater artefacts are signed once the key exists (M7a-2).
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # macOS: a free self-signed identity when the maintainer has set one
          # up, ad-hoc ("-") until then. Apple Silicon won't run unsigned code.
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY || '-' }}
        run: pnpm tauri build --target ${{ matrix.target }} --bundles ${{ matrix.bundles }}

      # 4. Smoke: what breaks releases is packaging, not code.
      - name: The bundle carries the model and the citation resources
        run: node scripts/release/check-bundle.mjs ${{ matrix.target }}

      - name: The AppImage starts and stays up for 30 seconds
        if: runner.os == 'Linux'
        env:
          APPIMAGE_EXTRACT_AND_RUN: '1'
          WEBKIT_DISABLE_DMABUF_RENDERER: '1'
        run: |
          image=$(ls src-tauri/target/${{ matrix.target }}/release/bundle/appimage/*.AppImage)
          set +e
          xvfb-run --auto-servernum timeout 30 "$image"
          code=$?
          set -e
          # 124 is timeout's "still running when time was up", which is the pass.
          if [ "$code" -ne 124 ]; then
            echo "The app exited with $code within 30 seconds."
            exit 1
          fi

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bundle-${{ matrix.target }}
          if-no-files-found: error
          path: |
            src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg
            src-tauri/target/${{ matrix.target }}/release/bundle/macos/*.app.tar.gz*
            src-tauri/target/${{ matrix.target }}/release/bundle/nsis/*.exe*
            src-tauri/target/${{ matrix.target }}/release/bundle/msi/*.msi
            src-tauri/target/${{ matrix.target }}/release/bundle/appimage/*.AppImage*
            src-tauri/target/${{ matrix.target }}/release/bundle/deb/*.deb

  draft:
    name: 5. Draft release
    # A dry run stops here: the artefacts are on the run.
    if: github.ref_type == 'tag'
    needs: [verify, ci, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: bundle-*
          path: dist
          merge-multiple: true

      - name: Checksums, latest.json and notes
        run: node scripts/release/assemble.mjs dist "${{ needs.verify.outputs.version }}" "$GITHUB_REF_NAME"

      - name: Create the draft
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          # A version with a pre-release part (0.9.0-beta.1) is a GitHub
          # pre-release, so latest.json keeps pointing at the last full release.
          prerelease=""
          case "$VERSION" in *-*) prerelease="--prerelease" ;; esac
          gh release create "$GITHUB_REF_NAME" --draft --verify-tag $prerelease \
            --title "Erti $VERSION" --notes-file release-notes.md dist/*
