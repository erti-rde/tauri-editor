<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<link rel="icon" href="%sveltekit.assets%/favicon.png" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		%sveltekit.head%
		<script>
			// Runs before the first paint, so nothing flashes the wrong theme.
			//
			// The settings file is only readable after mount, which is a frame too
			// late — someone who chose light on a dark machine would see dark first
			// on every launch. The choice is mirrored into localStorage, which is
			// synchronous and readable here.
			try {
				var chosen = localStorage.getItem('erti.theme');
				document.documentElement.dataset.theme =
					chosen && chosen !== 'system'
						? chosen
						: window.matchMedia('(prefers-color-scheme: dark)').matches
							? 'dark'
							: 'light';
			} catch {
				document.documentElement.dataset.theme = 'light';
			}
		</script>
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
