# pnpm 10+ no longer reads the `pnpm` field from package.json; build-script approval
# lives here. Both packages ship native binaries that their postinstall step fetches
# or compiles, so they must be allowed to build.
allowBuilds:
  '@tailwindcss/oxide': true
  esbuild: true
  # Pulled in by WebdriverIO (M1a-2). Their install scripts download Edge and
  # Firefox drivers; the real-app journeys use tauri-driver, so nothing is fetched.
  edgedriver: false
  geckodriver: false
